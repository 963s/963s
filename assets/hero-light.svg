<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-label="404Human: rust, headless browsers, security, fiscal systems">
  <title>404Human</title>
  <style>
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: none } }
  @keyframes draw { from { stroke-dashoffset: var(--len, 400) } to { stroke-dashoffset: 0 } }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important } }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .tab { font-variant-numeric: tabular-nums; }
    
    @keyframes travel { from { offset-distance: 0%; opacity: 1 } 85% { opacity: 1 } to { offset-distance: 100%; opacity: 0 } }
    @keyframes ripple { from { transform: scale(1); opacity: .7 } to { transform: scale(3); opacity: 0 } }
    @keyframes spin { to { transform: rotate(360deg) } }
  </style>
  <defs>
