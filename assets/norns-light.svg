<svg xmlns="http://www.w3.org/2000/svg" width="590" height="320" viewBox="0 0 590 320" role="img" aria-label="Norns">
  <title>Norns</title>
  <style>
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(8px) } to { opacity: 1; transform: none } }
  @keyframes draw { from { stroke-dashoffset: 260 } to { stroke-dashoffset: 0 } }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes scan { from { transform: translateY(0); opacity: 1 } to { transform: translateY(300px); opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
  </style>
  <clipPath id="c"><rect x="0.5" y="0.5" width="589" height="319" rx="14"/></clipPath>
  <g clip-path="url(#c)">
    <rect width="590" height="320" fill="#f6f8fa"/>
    <rect width="590" height="3" fill="#9a6700"/>
  </g>
  <rect x="0.5" y="0.5" width="589" height="319" rx="14" fill="none" stroke="#d8dee4"/>
  <text class="mono" x="32" y="42" font-size="12" fill="#9a6700" letter-spacing="2.4">BUILDING</text>
  <text class="sans" x="32" y="82" font-size="34" font-weight="800" fill="#1f2328" letter-spacing="-0.8">Norns</text>
  <g class="sans" font-size="16" fill="#5f6b77">
    <text x="32" y="120">offline-first point-of-sale for precious-metal dealers.</text>
    <text x="32" y="144">fiscal signing (TSE), tax exports exact to the cent.</text>
