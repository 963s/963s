  </g>
  <line x1="32" y1="194.5" x2="558" y2="194.5" stroke="#d8dee4"/>
  <g style="animation: rise .6s .3s backwards">
    <g transform="translate(32 236)">
      <text class="sans" font-size="30" font-weight="800" fill="#1f2328" letter-spacing="-0.5">1,488</text>
      <text class="mono" y="22" font-size="12" fill="#5f6b77" letter-spacing="0.8">COMMITS</text>
    </g>
    <g transform="translate(207.33333333333334 236)">
      <text class="sans" font-size="30" font-weight="800" fill="#1f2328" letter-spacing="-0.5">43</text>
      <text class="mono" y="22" font-size="12" fill="#5f6b77" letter-spacing="0.8">RELEASES</text>
