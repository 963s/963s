<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="448" viewBox="0 0 1200 448" role="img" aria-label="upstream pull requests by 963s">
  <title>the receipts</title>
  <style>
  @keyframes fade { from { opacity: 0 } to { opacity: 1 } }
  @keyframes rise { from { opacity: 0; transform: translateY(10px) } to { opacity: 1; transform: none } }
  @keyframes pop { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: none } }
  @keyframes draw { from { stroke-dashoffset: var(--len, 400) } to { stroke-dashoffset: 0 } }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes pulse { 0%, 100% { opacity: .35 } 50% { opacity: 1 } }
  @media (prefers-reduced-motion: reduce) { *, *::before { animation: none !important } }
    .mono { font-family: ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace; }
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; }
    .tab { font-variant-numeric: tabular-nums; }
    @keyframes grow { from { transform: scaleX(0) } to { transform: none } }
  </style>
  <defs>
    <filter id="receipts-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0.035 0"/>
    </filter>
    <filter id="receipts-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="receipts-clip"><rect x=".5" y=".5" width="1199" height="447" rx="16"/></clipPath>
    <pattern id="receipts-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#d6dde4"/>
    </pattern>
  </defs>
